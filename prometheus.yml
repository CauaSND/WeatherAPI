global:
  scrape_interval: 30s
remote_write:
  - url: https://prometheus-prod-40-prod-sa-east-1.grafana.net/api/prom/push
    basic_auth:
      username: ${grafanaPasswd}
      password: ${grafanaPasswd}
scrape_configs:
  - job_name: 'spring-boot-api'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ["web:8080"]
